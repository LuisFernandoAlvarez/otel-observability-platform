global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'service-a'
    static_configs:
      - targets: ['service-a:8000']

  - job_name: 'service-b'
    static_configs:
      - targets: ['service-b:8000']
