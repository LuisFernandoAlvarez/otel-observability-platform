apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: service-b
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/otel-observability/service-b:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: service-b
            - name: OTEL_SERVICE_NAME
              value: service-b
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=service-b,deployment.environment=gcp
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: DATABASE_URL
              value: postgresql+psycopg2://postgres:postgres@HOST:5432/service_b
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
